version: '3.8'

services:
  api-gateway:
    build:
      context: ../..
      dockerfile: infra/cloud/Dockerfile.backend
    container_name: tereguwami-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://tereguwami_user:tereguwami_pass@postgres:5432/tereguwami_db
      - REDIS_URL=redis://redis:6379/0
      - TEREGUWAMI_SECRET_KEY=production_jwt_secret_token_2026
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  leaderboard:
    build:
      context: ../..
      dockerfile: infra/edge-deployment/Dockerfile.edge
    container_name: tereguwami-leaderboard
    command: ["uvicorn", "evaluation.leaderboard_server.leaderboard_app:leaderboard_app", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "8001:8001"
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    container_name: tereguwami-postgres
    environment:
      POSTGRES_USER: tereguwami_user
      POSTGRES_PASSWORD: tereguwami_pass
      POSTGRES_DB: tereguwami_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: tereguwami-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  pgdata:
