<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>TERGUAMI (ተርጓሚ) — 3D Digital Human EthSL Sign Language Avatar</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+Ethiopic:wght@400;700&family=Plus+Jakarta+Sans:wght@500;700&display=swap" rel="stylesheet">

  <script type="importmap">
  {
    "imports": {
      "three":          "https://unpkg.com/three@0.158.0/build/three.module.js",
      "three/addons/":  "https://unpkg.com/three@0.158.0/examples/jsm/"
    }
  }
  </script>

  <style>
    :root {
      --cyan:   #00e5ff;
      --gold:   #f59e0b;
      --dark:   #0f1318;
      --bg2:    rgba(15, 19, 24, 0.88);
      --border: rgba(0, 229, 255, 0.25);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--dark); width: 100vw; height: 100vh; overflow: hidden; font-family: 'Plus Jakarta Sans', sans-serif; }
    canvas { display: block; width: 100vw !important; height: 100vh !important; }

    /* Loading */
    #loading {
      position: fixed; inset: 0; z-index: 300;
      background: var(--dark);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
      transition: opacity 0.7s;
    }
    #loading h1 { font-family: 'Noto Sans Ethiopic', sans-serif; color: var(--cyan); font-size: 32px; letter-spacing: 2px; }
    #loading p  { font-family: 'JetBrains Mono', monospace; color: rgba(0, 229, 255, 0.7); font-size: 11px; letter-spacing: 3px; text-transform: uppercase; }
    .prog-outer { width: 280px; height: 3px; background: rgba(0, 229, 255, 0.15); border-radius: 2px; overflow: hidden; }
    #prog       { height: 100%; width: 0%; background: var(--cyan); box-shadow: 0 0 10px var(--cyan); transition: width 0.2s; }
    #load-msg   { font-family: 'JetBrains Mono', monospace; color: rgba(255, 255, 255, 0.5); font-size: 11px; letter-spacing: 1.5px; }

    /* Top Bar */
    #top-bar {
      position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
      z-index: 100; display: flex; gap: 12px; align-items: center; pointer-events: none;
    }
    .badge {
      background: var(--bg2); border: 1px solid var(--border); border-radius: 20px; padding: 7px 18px;
      backdrop-filter: blur(16px); font-family: 'JetBrains Mono', monospace;
      font-size: 11px; color: var(--cyan); letter-spacing: 1.5px; text-transform: uppercase; white-space: nowrap;
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #00e676; box-shadow: 0 0 8px #00e676; display: inline-block; margin-right: 8px; }

    /* Bottom HUD */
    #bottom {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
      background: linear-gradient(0deg, rgba(15, 19, 24, 0.98) 0%, transparent 100%);
      padding: 20px 32px;
      display: flex; align-items: flex-end; justify-content: space-between;
      pointer-events: none;
    }
    .geez  { font-family: 'Noto Sans Ethiopic', sans-serif; font-size: 20px; font-weight: 700; color: #ffffff; }
    .gloss { font-size: 13px; color: rgba(255, 255, 255, 0.5); font-style: italic; margin-top: 4px; }
    .controls-strip { display: flex; gap: 10px; pointer-events: auto; }
    .hud-btn {
      background: rgba(0, 229, 255, 0.1); border: 1px solid var(--border); color: #fff;
      padding: 6px 14px; border-radius: 6px; font-size: 12px; cursor: pointer; font-family: 'JetBrains Mono', monospace;
      transition: all 0.2s;
    }
    .hud-btn:hover { background: rgba(0, 229, 255, 0.25); border-color: var(--cyan); }
  </style>
</head>
<body>

<div id="loading">
  <h1>ተርጓሚ</h1>
  <p>TERGUAMI · Digital Human Avatar</p>
  <div class="prog-outer"><div id="prog"></div></div>
  <div id="load-msg">Building 3D Mesh & MANO Hand Rig...</div>
</div>

<div id="top-bar">
  <div class="badge"><span class="dot"></span>TERGUAMI — 3D Sign Language Instructor</div>
  <div class="badge" id="fps-badge">60 FPS</div>
</div>

<div id="bottom">
  <div>
    <div class="geez" id="g-text">ጤና ይስጥልኝ እንደምን ነዎት?</div>
    <div class="gloss" id="l-text">Hello / Greetings — EthSL Natural Signing Stance</div>
  </div>
  <div class="controls-strip">
    <button class="hud-btn" id="btn-sign-greetings">ሰላምታ (Hello)</button>
    <button class="hud-btn" id="btn-sign-rx">መድኃኒት (Medicine)</button>
    <button class="hud-btn" id="btn-sign-repeat">ማብራሪያ (Explain)</button>
    <button class="hud-btn" id="btn-mirror">Mirror Mode</button>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ── Progress helper ──────────────────────────────────────────────────────────
const prog = document.getElementById('prog');
const msg  = document.getElementById('load-msg');
function setP(p, m) { prog.style.width = p + '%'; if (m) msg.textContent = m; }

setP(20, 'Initializing WebGL renderer...');

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0f1318);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 50);
camera.position.set(0, 1.38, 1.85);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.22, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.minDistance = 0.8;
controls.maxDistance = 4.0;
controls.update();

// ── Lighting ────────────────────────────────────────────────────────────────
const ambient = new THREE.AmbientLight(0xffffff, 0.85);
scene.add(ambient);

const keyLight = new THREE.DirectionalLight(0xfff3e0, 1.6);
keyLight.position.set(2.5, 3.5, 2.5);
keyLight.castShadow = true;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0xdbeafe, 0.9);
fillLight.position.set(-2.5, 2.0, 2.0);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0x00e5ff, 1.1);
rimLight.position.set(0, 3.2, -2.5);
scene.add(rimLight);

setP(50, 'Sculpting TERGUAMI Digital Human Mesh & MANO Hands...');

// ── Construct TERGUAMI Digital Human ─────────────────────────────────────────
const rootGroup = new THREE.Group();
scene.add(rootGroup);

const skinMaterial = new THREE.MeshStandardMaterial({ color: 0x734327, roughness: 0.48, metalness: 0.08 });
const suitMaterial = new THREE.MeshStandardMaterial({ color: 0x16191d, roughness: 0.75, metalness: 0.12 });
const innerShirtMaterial = new THREE.MeshStandardMaterial({ color: 0x0c0e10, roughness: 0.85 });
const hairMaterial = new THREE.MeshStandardMaterial({ color: 0x141110, roughness: 0.65, metalness: 0.15 });
const cyanGlowMaterial = new THREE.MeshStandardMaterial({ color: 0x00e5ff, emissive: 0x00c4e6, emissiveIntensity: 0.85, roughness: 0.2 });
const sensorHardwareMaterial = new THREE.MeshStandardMaterial({ color: 0xdde4ea, roughness: 0.25, metalness: 0.8 });
const goldContactMaterial = new THREE.MeshStandardMaterial({ color: 0xf59e0b, roughness: 0.3, metalness: 0.7 });

// Pelvis & Spine
const pelvis = new THREE.Group();
pelvis.position.set(0, 0.92, 0);
rootGroup.add(pelvis);

const lowerTorso = new THREE.Mesh(new THREE.CylinderGeometry(0.185, 0.165, 0.22, 28), suitMaterial);
lowerTorso.position.y = 0.11;
pelvis.add(lowerTorso);

const spine = new THREE.Group();
spine.position.set(0, 0.22, 0);
pelvis.add(spine);

const chestGeo = new THREE.CylinderGeometry(0.245, 0.195, 0.26, 32);
chestGeo.scale(1.15, 1.0, 0.88);
const chest = new THREE.Mesh(chestGeo, suitMaterial);
chest.position.y = 0.13;
spine.add(chest);

// High Dark Turtleneck & Neck
const innerShirt = new THREE.Mesh(new THREE.CylinderGeometry(0.085, 0.11, 0.14, 24), innerShirtMaterial);
innerShirt.position.set(0, 0.21, 0.02);
spine.add(innerShirt);

const neck = new THREE.Group();
neck.position.set(0, 0.27, 0);
spine.add(neck);

const neckMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.062, 0.075, 0.12, 24), skinMaterial);
neckMesh.position.y = 0.06;
neck.add(neckMesh);

// Luminous Collar Necklace ("TEREGUWAMI · ተርጓሚ")
const collarTorusGeo = new THREE.TorusGeometry(0.078, 0.012, 16, 40);
collarTorusGeo.rotateX(Math.PI / 2);
collarTorusGeo.scale(1.0, 1.15, 1.0);
const collarMesh = new THREE.Mesh(collarTorusGeo, cyanGlowMaterial);
collarMesh.position.set(0, 0.04, 0.01);
neck.add(collarMesh);

// Head & Face
const head = new THREE.Group();
head.position.set(0, 0.12, 0);
neck.add(head);

const craniumGeo = new THREE.SphereGeometry(0.125, 36, 28);
craniumGeo.scale(0.96, 1.18, 1.08);
const cranium = new THREE.Mesh(craniumGeo, skinMaterial);
head.add(cranium);

const jawGeo = new THREE.ConeGeometry(0.09, 0.12, 24);
jawGeo.rotateX(Math.PI);
jawGeo.scale(1.0, 0.8, 0.9);
const jaw = new THREE.Mesh(jawGeo, skinMaterial);
jaw.position.set(0, -0.06, 0.035);
head.add(jaw);

// Braided Hair Crown & Bun
const hairCrownGeo = new THREE.SphereGeometry(0.134, 32, 24);
hairCrownGeo.scale(0.98, 1.16, 1.06);
const hairCrown = new THREE.Mesh(hairCrownGeo, hairMaterial);
hairCrown.position.set(0, 0.025, -0.02);
head.add(hairCrown);

const bun = new THREE.Mesh(new THREE.SphereGeometry(0.072, 24, 20), hairMaterial);
bun.scale.set(1.1, 0.9, 0.8);
bun.position.set(0, 0.04, -0.14);
head.add(bun);

// Eyes & Brows
const createEye = (isLeft) => {
  const eyeGroup = new THREE.Group();
  eyeGroup.position.set(isLeft ? -0.038 : 0.038, 0.018, 0.115);
  const eyeball = new THREE.Mesh(new THREE.SphereGeometry(0.015, 16, 16), new THREE.MeshBasicMaterial({ color: 0xf8fafc }));
  const iris = new THREE.Mesh(new THREE.CircleGeometry(0.0075, 16), new THREE.MeshStandardMaterial({ color: 0x3d2314, roughness: 0.1 }));
  iris.position.set(0, 0, 0.014);
  const pupil = new THREE.Mesh(new THREE.CircleGeometry(0.0035, 16), new THREE.MeshBasicMaterial({ color: 0x050505 }));
  pupil.position.set(0, 0, 0.0145);
  eyeball.add(iris);
  eyeball.add(pupil);
  eyeGroup.add(eyeball);
  return eyeGroup;
};
head.add(createEye(true));
head.add(createEye(false));

// Earpiece Hardware & Cheek Electrodes
const earpiece = new THREE.Mesh(new THREE.BoxGeometry(0.018, 0.048, 0.022), sensorHardwareMaterial);
earpiece.position.set(0.125, 0.02, 0.01);
head.add(earpiece);

const electrode1 = new THREE.Mesh(new THREE.CylinderGeometry(0.0065, 0.0065, 0.004, 12), goldContactMaterial);
electrode1.rotateZ(Math.PI / 2);
electrode1.position.set(0.098, 0.0, 0.082);
head.add(electrode1);

const electrode2 = new THREE.Mesh(new THREE.CylinderGeometry(0.0065, 0.0065, 0.004, 12), goldContactMaterial);
electrode2.rotateZ(Math.PI / 2);
electrode2.position.set(0.082, -0.038, 0.075);
head.add(electrode2);

// ── MANO Articulated Hands ──────────────────────────────────────────────────
const buildHand = (isLeft) => {
  const side = isLeft ? -1 : 1;
  const handRoot = new THREE.Group();
  const palm = new THREE.Mesh(new THREE.BoxGeometry(0.052, 0.068, 0.022), skinMaterial);
  palm.position.y = -0.034;
  handRoot.add(palm);

  const fingers = [];
  const specs = [
    { x: side * -0.028, y: -0.018, len: 0.022, r: 0.0065 },
    { x: side * -0.018, y: -0.068, len: 0.028, r: 0.0055 },
    { x: side * -0.006, y: -0.072, len: 0.032, r: 0.0058 },
    { x: side * 0.007, y: -0.068, len: 0.029, r: 0.0054 },
    { x: side * 0.019, y: -0.062, len: 0.024, r: 0.0048 }
  ];

  specs.forEach(s => {
    const mcp = new THREE.Group();
    mcp.position.set(s.x, s.y, 0);
    handRoot.add(mcp);

    const p1 = new THREE.Mesh(new THREE.CylinderGeometry(s.r * 0.9, s.r, s.len, 10), skinMaterial);
    p1.position.y = -s.len * 0.5;
    mcp.add(p1);

    const pip = new THREE.Group();
    pip.position.y = -s.len;
    mcp.add(pip);

    const p2 = new THREE.Mesh(new THREE.CylinderGeometry(s.r * 0.8, s.r * 0.9, s.len * 0.8, 10), skinMaterial);
    p2.position.y = -s.len * 0.4;
    pip.add(p2);

    const dip = new THREE.Group();
    dip.position.y = -s.len * 0.8;
    pip.add(dip);

    const p3 = new THREE.Mesh(new THREE.CylinderGeometry(s.r * 0.65, s.r * 0.8, s.len * 0.65, 10), skinMaterial);
    p3.position.y = -s.len * 0.32;
    dip.add(p3);

    fingers.push({ mcp, pip, dip });
  });

  return { root: handRoot, fingers };
};

const createArm = (isLeft) => {
  const side = isLeft ? -1 : 1;
  const shoulder = new THREE.Group();
  shoulder.position.set(side * 0.24, 0.22, 0.0);
  spine.add(shoulder);

  const upperArm = new THREE.Mesh(new THREE.CylinderGeometry(0.052, 0.046, 0.27, 24), suitMaterial);
  upperArm.position.y = -0.135;
  shoulder.add(upperArm);

  const elbow = new THREE.Group();
  elbow.position.set(0, -0.27, 0);
  shoulder.add(elbow);

  const forearmSleeve = new THREE.Mesh(new THREE.CylinderGeometry(0.046, 0.041, 0.18, 24), suitMaterial);
  forearmSleeve.position.y = -0.09;
  elbow.add(forearmSleeve);

  const forearmSkin = new THREE.Mesh(new THREE.CylinderGeometry(0.038, 0.033, 0.09, 20), skinMaterial);
  forearmSkin.position.y = -0.225;
  elbow.add(forearmSkin);

  const wrist = new THREE.Group();
  wrist.position.set(0, -0.26, 0);
  elbow.add(wrist);

  const hand = buildHand(isLeft);
  wrist.add(hand.root);

  return { shoulder, elbow, wrist, hand };
};

const leftArm = createArm(true);
const rightArm = createArm(false);

// Initial Signing Stance
leftArm.shoulder.rotation.set(0.65, 0.25, -0.45);
leftArm.elbow.rotation.set(-1.45, 0.1, -0.3);
leftArm.wrist.rotation.set(0.35, 0.2, 0.15);

rightArm.shoulder.rotation.set(0.65, -0.25, 0.45);
rightArm.elbow.rotation.set(-1.45, -0.1, 0.3);
rightArm.wrist.rotation.set(0.35, -0.2, -0.15);

[leftArm.hand, rightArm.hand].forEach(h => {
  h.fingers.forEach((f, idx) => {
    f.mcp.rotation.x = -0.15 - (idx * 0.05);
    f.pip.rotation.x = -0.12;
    f.dip.rotation.x = -0.08;
  });
});

setP(100, 'TERGUAMI Ready');
setTimeout(() => {
  const loadEl = document.getElementById('loading');
  loadEl.style.opacity = '0';
  setTimeout(() => loadEl.remove(), 700);
}, 400);

// ── Interactive Controls ────────────────────────────────────────────────────
let isMirrored = false;
document.getElementById('btn-mirror').addEventListener('click', () => {
  isMirrored = !isMirrored;
  rootGroup.scale.x = isMirrored ? -1 : 1;
});

// Animation Loop
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  controls.update();

  const t = clock.getElapsedTime();
  spine.position.y = 0.22 + Math.sin(t * 1.8) * 0.006;
  head.rotation.x = Math.sin(t * 1.2) * 0.015;
  head.rotation.y = Math.cos(t * 0.9) * 0.02;

  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
