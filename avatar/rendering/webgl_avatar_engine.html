<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Tereguwami 3D Avatar Production Studio</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: radial-gradient(circle at center, #1e2430 0%, #0d1117 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      display: block;
    }
    #loading-indicator {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #58a6ff;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 1px;
      transition: opacity 0.4s ease;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
  <div id="loading-indicator">INITIALIZING TEREGUWAMI 3D AVATAR...</div>
  <div id="canvas-container"></div>

  <script>
    let scene, camera, renderer, avatarModel;
    const bones = {};
    const morphMeshes = [];
    const AVATAR_URL = 'https://models.readyplayer.me/661feb3563b4a87a148eb0df.glb?morphTargets=ARKit,Oculus%20Visemes&meshLod=1';

    function init() {
      const container = document.getElementById('canvas-container');
      scene = new THREE.Scene();

      // Camera framed to capture signer torso, hands, and facial Action Units
      camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 50);
      camera.position.set(0, 1.35, 1.25);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2.0));
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.1;
      container.appendChild(renderer.domElement);

      // Studio 3-Point Lighting
      const hemiLight = new THREE.HemisphereLight(0xffffff, 0x223344, 1.4);
      scene.add(hemiLight);

      const keyLight = new THREE.DirectionalLight(0xffffff, 1.2);
      keyLight.position.set(1.5, 2.5, 2.0);
      scene.add(keyLight);

      const fillLight = new THREE.DirectionalLight(0x88bbff, 0.6);
      fillLight.position.set(-1.5, 1.5, 1.0);
      scene.add(fillLight);

      loadRPMModel(AVATAR_URL);
      animate();
    }

    function loadRPMModel(url) {
      const loader = new THREE.GLTFLoader();
      loader.load(url, (gltf) => {
        if (avatarModel) scene.remove(avatarModel);
        avatarModel = gltf.scene;
        scene.add(avatarModel);

        avatarModel.traverse((node) => {
          if (node.isBone) {
            bones[node.name] = node;
          }
          if (node.isMesh && node.morphTargetDictionary) {
            morphMeshes.push(node);
          }
        });

        const loaderText = document.getElementById('loading-indicator');
        if (loaderText) {
          loaderText.style.opacity = '0';
          setTimeout(() => loaderText.remove(), 400);
        }
        console.log(`[Tereguwami Avatar] RPM Model Loaded. Indexed ${Object.keys(bones).length} bones and ${morphMeshes.length} morph targets.`);
      }, undefined, (error) => {
        console.error('[Tereguwami Avatar] Failed to load Ready Player Me GLB:', error);
      });
    }

    // High-performance direct frame updater (called from WebSocket / API stream)
    window.renderSignFrame = function(framePayload) {
      if (!avatarModel) return;
      const frame = (typeof framePayload === 'string') ? JSON.parse(framePayload) : framePayload;

      // 1. Update Joint Rotations (SMPL-X / MANO retargeted bones)
      if (frame.rotations) {
        for (const [boneName, rot] of Object.entries(frame.rotations)) {
          if (bones[boneName]) {
            bones[boneName].rotation.set(rot.x, rot.y, rot.z);
          }
        }
      }

      // 2. Update ARKit Facial Action Units (Eyebrows, Eyes, Mouth)
      if (frame.blendshapes) {
        for (let i = 0; i < morphMeshes.length; i++) {
          const mesh = morphMeshes[i];
          for (const [shapeName, weight] of Object.entries(frame.blendshapes)) {
            const index = mesh.morphTargetDictionary[shapeName];
            if (index !== undefined) {
              mesh.morphTargetInfluences[index] = weight;
            }
          }
        }
      }
    };

    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    window.onload = init;
  </script>
</body>
</html>
