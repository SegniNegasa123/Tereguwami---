name: Tereguwami CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Automated Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx

      - name: Run Pytest Suite
        run: |
          python -m pytest -v --tb=short

      - name: Verify Model Architectures & Synthesizers
        run: |
          python -c "from models.translation.gloss_free_transformer import continuous_translator; print('Translation Engine Ready')"
          python -c "from models.production.progressive_transformer import avatar_production_engine; print('Avatar Engine Ready')"
          python -c "from models.personalization.siamese_few_shot import sign_personalizer; print('Few-Shot Engine Ready')"
          python -c "from models.silent_speech.emg_decoder import silent_speech_decoder; print('Silent Speech Ready')"

  docker-build:
    name: Build & Verify Production Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./infra/cloud/Dockerfile.backend
          push: false
          tags: tereguwami-backend:latest
